{% extends "home/base.html" %}

{% block title %}設定新密碼｜Worksite GIS{% endblock %}

{% block content %}
<section class="hero">
    {% if validlink %}
        <p class="eyebrow">帳號安全</p>
        <h1>設定新密碼</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="primary-button" type="submit">設定新密碼</button>
        </form>
    {% else %}
        <h1>連結無效</h1>
        <p>此密碼重設連結無效或已過期，請重新申請。</p>
        <a class="primary-button" href="{% url 'password_reset' %}">重新申請</a>
    {% endif %}
</section>
{% endblock %}
