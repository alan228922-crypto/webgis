{% extends "home/base.html" %}

{% block title %}重設密碼｜Worksite GIS{% endblock %}

{% block content %}
<section class="hero">
    <p class="eyebrow">帳號安全</p>
    <h1>忘記密碼</h1>
    <p>輸入註冊信箱後，若帳號符合條件，我們會寄出重設密碼信件。</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary-button" type="submit">寄送重設信件</button>
    </form>
</section>
{% endblock %}
